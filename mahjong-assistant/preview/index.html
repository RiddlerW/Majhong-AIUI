<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=480, initial-scale=1.0">
<title>麻将助手 - AIUI 预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a1a;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}
.phone-frame {
  width: 480px;
  min-height: 380px;
  max-height: 700px;
  overflow-y: auto;
  background: #000;
  border-radius: 16px;
  overflow-x: hidden;
  border: 2px solid #333;
  position: relative;
}
.page { display: none; flex-direction: column; padding: 20px; min-height: 380px; }
.page.active { display: flex; }

.title { font-size: 22px; color: #40FF5E; font-weight: bold; margin-bottom: 16px; }
.subtitle { font-size: 16px; color: rgba(64,255,94,0.6); margin-bottom: 20px; }

.rule-list { width: 100%; }
.rule-card {
  display: flex; align-items: center; padding: 16px 20px;
  margin-bottom: 12px; border-radius: 12px; cursor: pointer;
  border: 2px solid rgba(64,255,94,0.2); background: rgba(64,255,94,0.05);
  transition: all 0.2s;
}
.rule-card:hover { border-color: rgba(64,255,94,0.5); }
.rule-card.selected { border-color: #40FF5E; background: rgba(64,255,94,0.15); }
.rule-name { font-size: 20px; color: #40FF5E; font-weight: bold; flex: 1; }
.rule-desc { font-size: 14px; color: rgba(64,255,94,0.5); margin-left: 12px; }
.rule-check { font-size: 20px; color: #40FF5E; margin-left: 8px; }

.btn {
  width: 100%; height: 50px; border-radius: 12px; border: none;
  font-size: 18px; font-weight: bold; cursor: pointer; text-align: center;
  line-height: 50px; margin-top: 8px; transition: opacity 0.2s;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: #40FF5E; color: #000; }
.btn-secondary { background: rgba(64,255,94,0.15); color: #40FF5E; border: 1px solid rgba(64,255,94,0.3); }
.btn-small { height: 40px; font-size: 14px; line-height: 40px; }
.btn-danger { background: rgba(255,100,100,0.15); color: rgba(255,100,100,0.9); border: 1px solid rgba(255,100,100,0.3); }

.camera-area {
  width: 100%; height: 180px; border-radius: 12px;
  border: 2px solid rgba(64,255,94,0.3); background: rgba(64,255,94,0.05);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px; color: rgba(64,255,94,0.4); font-size: 18px;
}
.status-text { font-size: 14px; color: rgba(64,255,94,0.6); margin-bottom: 16px; text-align: center; }

.section { margin-bottom: 12px; }
.section-header { display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.section-label { font-size: 14px; color: rgba(64,255,94,0.5); }
.section-action { font-size: 14px; color: #40FF5E; cursor: pointer; padding: 2px 8px; }
.tile-list { display: flex; flex-direction: row; flex-wrap: wrap; }
.tile-item {
  display: flex; align-items: center; background: rgba(64,255,94,0.1);
  border-radius: 8px; padding: 6px 10px; margin: 4px;
}
.tile-name { font-size: 16px; color: #40FF5E; }
.tile-count { font-size: 14px; color: rgba(64,255,94,0.6); margin-left: 4px; }

.peng-item { background: rgba(255,165,0,0.15) !important; border: 1px solid rgba(255,165,0,0.3); }
.peng-item .tile-name { color: #FFA500; }
.gang-item { background: rgba(255,100,100,0.15) !important; border: 1px solid rgba(255,100,100,0.3); }
.gang-item .tile-name { color: rgba(255,100,100,0.9); }
.tile-remove { font-size: 14px; color: rgba(255,100,100,0.7); margin-left: 8px; cursor: pointer; padding: 2px 4px; }
.empty-hint { font-size: 13px; color: rgba(64,255,94,0.3); }

.actions { display: flex; flex-direction: row; margin-top: auto; padding-top: 16px; gap: 8px; }
.actions .btn { flex: 1; margin-top: 0; }

.best-card {
  background: rgba(64,255,94,0.15); border: 2px solid #40FF5E;
  border-radius: 12px; padding: 16px; margin-bottom: 16px; position: relative;
}
.best-label { font-size: 14px; color: rgba(64,255,94,0.6); }
.best-tile { font-size: 28px; color: #40FF5E; font-weight: bold; display: block; margin: 8px 0; }
.best-listen { font-size: 16px; color: #40FF5E; display: block; }
.best-shanten { font-size: 16px; color: #FFA500; display: block; }
.best-remaining { font-size: 14px; color: rgba(64,255,94,0.6); display: block; margin-top: 4px; }

.alt-title { font-size: 14px; color: rgba(64,255,94,0.5); margin-bottom: 8px; }
.alt-item { background: rgba(64,255,94,0.05); border-radius: 8px; padding: 8px 12px; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; }
.alt-text { font-size: 14px; color: rgba(64,255,94,0.9); font-weight: bold; }
.alt-listen { font-size: 13px; color: rgba(64,255,94,0.7); margin-left: 6px; }
.alt-shanten { font-size: 13px; color: #FFA500; margin-left: 6px; }
.alt-remaining { font-size: 12px; color: rgba(64,255,94,0.5); margin-left: 6px; }

.listen-item {
  background: rgba(64,255,94,0.15); border: 1px solid rgba(64,255,94,0.4);
  border-radius: 8px; padding: 8px 14px; margin: 4px; display: inline-flex; align-items: center;
}
.tile-remaining { font-size: 12px; color: rgba(64,255,94,0.5); margin-left: 4px; }

.empty-text { font-size: 16px; color: rgba(64,255,94,0.4); margin-top: 20px; }
.error-text { font-size: 16px; color: rgba(255,100,100,0.8); margin-bottom: 20px; }

.manual-input {
  width: 100%; margin-top: 12px; padding: 12px;
  background: rgba(64,255,94,0.05); border: 1px solid rgba(64,255,94,0.2);
  border-radius: 8px; color: #40FF5E; font-size: 14px;
}
.manual-input label { display: block; margin-bottom: 6px; color: rgba(64,255,94,0.6); font-size: 13px; }
.manual-input textarea {
  width: 100%; height: 50px; background: rgba(0,0,0,0.5); border: 1px solid rgba(64,255,94,0.2);
  border-radius: 6px; color: #40FF5E; padding: 8px; font-size: 14px; resize: none;
}
.manual-input .btn { margin-top: 8px; }

.peng-input, .gang-input {
  width: 100%; margin-top: 8px; padding: 12px;
  background: rgba(255,165,0,0.05); border: 1px solid rgba(255,165,0,0.2);
  border-radius: 8px; color: #FFA500; font-size: 14px;
}
.gang-input {
  background: rgba(255,100,100,0.05); border: 1px solid rgba(255,100,100,0.2);
  color: rgba(255,100,100,0.9);
}
.peng-input label, .gang-input label { display: block; margin-bottom: 6px; font-size: 13px; }
.peng-input label { color: rgba(255,165,0,0.6); }
.gang-input label { color: rgba(255,100,100,0.6); }
.peng-input textarea, .gang-input textarea {
  width: 100%; height: 40px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,165,0,0.2);
  border-radius: 6px; color: #FFA500; padding: 8px; font-size: 14px; resize: none;
}
.gang-input textarea { border-color: rgba(255,100,100,0.2); color: rgba(255,100,100,0.9); }

.debug-panel {
  margin-top: 20px; padding: 16px; background: #111; border-radius: 12px;
  border: 1px solid #333; max-width: 480px;
}
.debug-panel h3 { color: #40FF5E; font-size: 16px; margin-bottom: 12px; }
.debug-panel .state-item { color: rgba(64,255,94,0.7); font-size: 13px; margin-bottom: 4px; word-break: break-all; }

.nav-bar {
  display: flex; justify-content: center; gap: 8px;
  padding: 8px; background: rgba(64,255,94,0.05); border-bottom: 1px solid rgba(64,255,94,0.1);
}
.nav-btn {
  padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(64,255,94,0.2);
  background: transparent; color: rgba(64,255,94,0.5); cursor: pointer; font-size: 12px;
}
.nav-btn.active { background: rgba(64,255,94,0.15); color: #40FF5E; border-color: #40FF5E; }

.adjust-display {
  display: flex; align-items: center; justify-content: center; margin: 20px 0;
}
.arrow-btn {
  width: 50px; height: 50px; border-radius: 25px; border: none;
  background: rgba(64,255,94,0.15); color: #40FF5E; font-size: 20px;
  cursor: pointer; line-height: 50px; text-align: center;
}
.adjust-info { display: flex; flex-direction: column; align-items: center; margin: 0 24px; }
.adjust-name { font-size: 32px; color: #40FF5E; font-weight: bold; }
.adjust-count { font-size: 20px; color: rgba(64,255,94,0.6); margin-top: 4px; }

.dingque-list { width: 100%; display: flex; flex-direction: row; justify-content: space-around; }
.dingque-card { display: flex; flex-direction: column; align-items: center; padding: 20px; border-radius: 16px; border: 2px solid rgba(64,255,94,0.2); background: rgba(64,255,94,0.05); width: 120px; cursor: pointer; }
.dingque-card:hover { border-color: rgba(64,255,94,0.5); }
.dingque-char { font-size: 40px; margin-bottom: 8px; }
.dingque-name { font-size: 18px; color: #40FF5E; font-weight: bold; }
.dingque-badge { margin-bottom: 12px; padding: 4px 12px; background: rgba(255,165,0,0.2); border-radius: 8px; display: inline-block; }
.dingque-text { font-size: 14px; color: #FFA500; }
.dingque-tag { position: absolute; top: -10px; right: 16px; background: #FFA500; color: #000; font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
.dingque-mark { color: #FFA500; font-size: 12px; margin-right: 6px; background: rgba(255,165,0,0.2); padding: 1px 4px; border-radius: 3px; }

.suggestion-item { background: rgba(64,255,94,0.05); border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; }
.suggestion-discard { font-size: 16px; color: #40FF5E; font-weight: bold; }
.suggestion-shanten { font-size: 14px; color: #FFA500; margin-left: 8px; }
.suggestion-remaining { font-size: 12px; color: rgba(64,255,94,0.5); margin-left: 8px; }

.fan-card { background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.4); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.fan-total { font-size: 20px; color: #FFD700; font-weight: bold; display: block; margin-bottom: 8px; }
.fan-list { display: flex; flex-direction: row; flex-wrap: wrap; }
.fan-item { font-size: 14px; color: rgba(255,215,0,0.7); background: rgba(255,215,0,0.1); border-radius: 6px; padding: 4px 8px; margin: 2px 4px 2px 0; }
.tile-fan { font-size: 12px; color: #FFD700; margin-left: 6px; background: rgba(255,215,0,0.15); padding: 1px 4px; border-radius: 3px; }

.add-peng-area, .add-gang-area {
  width: 100%; margin-top: 8px; padding: 12px;
  border-radius: 8px; font-size: 14px;
}
.add-peng-area { background: rgba(255,165,0,0.08); border: 1px solid rgba(255,165,0,0.3); }
.add-gang-area { background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.3); }
.add-peng-area .adjust-name { color: #FFA500; }
.add-gang-area .adjust-name { color: rgba(255,100,100,0.9); }
.add-peng-area .arrow-btn { background: rgba(255,165,0,0.15); color: #FFA500; }
.add-gang-area .arrow-btn { background: rgba(255,100,100,0.15); color: rgba(255,100,100,0.9); }
</style>
</head>
<body>

<div>
  <div class="phone-frame">
    <div class="nav-bar">
      <button class="nav-btn active" onclick="showPage('index')">规则选择</button>
      <button class="nav-btn" onclick="showPage('camera')">拍照识别</button>
      <button class="nav-btn" onclick="showPage('confirm')">确认手牌</button>
      <button class="nav-btn" onclick="showPage('result')">分析结果</button>
    </div>

    <div id="page-index" class="page active">
      <text class="title">🀄 麻将助手</text>
      <text class="subtitle">选择规则</text>
      <div class="rule-list" id="rule-list"></div>
      <button class="btn btn-primary" onclick="selectDingque()">确认开始</button>
    </div>

    <div id="page-dingque" class="page">
      <text class="title">🎯 选择定缺</text>
      <text class="subtitle">选择你要缺的花色</text>
      <div class="dingque-list">
        <div class="dingque-card" onclick="selectSuit('wan')">
          <text class="dingque-char">🀇</text>
          <text class="dingque-name">万</text>
        </div>
        <div class="dingque-card" onclick="selectSuit('tiao')">
          <text class="dingque-char">🀙</text>
          <text class="dingque-name">条</text>
        </div>
        <div class="dingque-card" onclick="selectSuit('tong')">
          <text class="dingque-char">🀐</text>
          <text class="dingque-name">筒</text>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="showPage('index')">← 返回</button>
    </div>

    <div id="page-camera" class="page">
      <div style="width:100%;margin-bottom:8px;">
        <span id="camera-rule-tag" style="font-size:14px;color:rgba(64,255,94,0.6);background:rgba(64,255,94,0.1);padding:4px 12px;border-radius:8px;">血战到底</span>
      </div>
      <div class="camera-area">📷 相机取景（预览模式）</div>
      <div class="manual-input">
        <label>手牌（用空格分隔，如：一万 一万 三万 四万 五万）<span id="hand-expected-hint" style="color:rgba(255,165,0,0.6);"></span></label>
        <textarea id="manual-tiles-input" placeholder="一万 一万 三万 四万 五万 二条 四条 六条 七条 三筒 五筒 八筒 九筒" oninput="updateHandHint()"></textarea>
      </div>
      <div class="peng-input">
        <label>碰牌（输入牌名，空格分隔，如：八万 东风 三万）</label>
        <textarea id="manual-peng-input" placeholder="八万 东风 三万" oninput="updateHandHint()"></textarea>
      </div>
      <div class="gang-input">
        <label>杠牌（输入牌名，空格分隔，如：五筒 九万）</label>
        <textarea id="manual-gang-input" placeholder="五筒 九万" oninput="updateHandHint()"></textarea>
      </div>
      <button class="btn btn-primary btn-small" onclick="manualRecognize()">确认输入</button>
      <text class="status-text" id="camera-status">预览模式：手动输入或模拟拍照</text>
      <button class="btn btn-secondary" onclick="simulateCapture()">模拟拍照识别</button>
    </div>

    <div id="page-confirm" class="page">
      <text class="title">识别结果确认</text>
      <div class="section">
        <div class="section-header">
          <text class="section-label" id="hand-count-label">手牌 (0张)</text>
          <text class="section-action" onclick="enterAdjustHand()">调整</text>
        </div>
        <div class="tile-list" id="hand-tile-list"></div>
      </div>
      <div class="section">
        <div class="section-header">
          <text class="section-label" id="peng-count-label">碰牌 (0组)</text>
          <text class="section-action" onclick="toggleAddPeng()">+添加</text>
        </div>
        <div class="tile-list" id="peng-tile-list"></div>
        <text class="empty-hint" id="peng-empty">无碰牌</text>
      </div>
      <div class="section">
        <div class="section-header">
          <text class="section-label" id="gang-count-label">杠牌 (0组)</text>
          <text class="section-action" onclick="toggleAddGang()">+添加</text>
        </div>
        <div class="tile-list" id="gang-tile-list"></div>
        <text class="empty-hint" id="gang-empty">无杠牌</text>
      </div>
      <div id="add-peng-area" class="add-peng-area" style="display:none;">
        <div class="adjust-display">
          <button class="arrow-btn" onclick="prevPengTile()">◀</button>
          <div class="adjust-info">
            <text class="adjust-name" id="add-peng-name">1万</text>
            <text class="adjust-count">×3(碰)</text>
          </div>
          <button class="arrow-btn" onclick="nextPengTile()">▶</button>
        </div>
        <div class="actions" style="padding-top:0;">
          <button class="btn btn-secondary btn-small" onclick="toggleAddPeng()" style="flex:1;">取消</button>
          <button class="btn btn-primary btn-small" onclick="confirmAddPeng()" style="flex:1;">确认添加</button>
        </div>
      </div>
      <div id="add-gang-area" class="add-gang-area" style="display:none;">
        <div class="adjust-display">
          <button class="arrow-btn" onclick="prevGangTile()">◀</button>
          <div class="adjust-info">
            <text class="adjust-name" id="add-gang-name">1万</text>
            <text class="adjust-count">×4(杠)</text>
          </div>
          <button class="arrow-btn" onclick="nextGangTile()">▶</button>
        </div>
        <div class="actions" style="padding-top:0;">
          <button class="btn btn-secondary btn-small" onclick="toggleAddGang()" style="flex:1;">取消</button>
          <button class="btn btn-primary btn-small" onclick="confirmAddGang()" style="flex:1;">确认添加</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="showPage('camera')">重拍</button>
        <button class="btn btn-primary" onclick="confirmAndAnalyze()">确认分析</button>
      </div>
    </div>

    <div id="page-adjust" class="page">
      <text class="title">调整手牌</text>
      <div class="adjust-display">
        <button class="arrow-btn" onclick="prevTile()">◀</button>
        <div class="adjust-info">
          <text class="adjust-name" id="adjust-name">1万</text>
          <text class="adjust-count" id="adjust-count">×0</text>
        </div>
        <button class="arrow-btn" onclick="nextTile()">▶</button>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="removeTile()">- 减</button>
        <button class="btn btn-secondary" onclick="addTile()">+ 加</button>
      </div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="finishAdjust()">完成调整</button>
    </div>

    <div id="page-result" class="page">
      <div id="result-content"></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="showPage('index')">切换规则</button>
        <button class="btn btn-primary" onclick="showPage('camera')">下一轮拍照</button>
      </div>
    </div>
  </div>

  <div class="debug-panel">
    <h3>🔍 调试状态</h3>
    <div id="debug-state"></div>
  </div>
</div>

<script src="../lib/mahjong-constants.js"></script>
<script src="../lib/mahjong-analyzer.js"></script>
<script src="../lib/mahjong-fan.js"></script>
<script>
var appState = {
  ruleType: 'xz',
  dingque: '',
  handTiles: [],
  pengTiles: [],
  gangTiles: [],
  lastRecognition: null,
  adjustIndex: 0,
  addPengIndex: 0,
  addGangIndex: 0,
  showAddPeng: false,
  showAddGang: false
};

var rules = [
  { id: 'xz', name: '血战到底', desc: '四川麻将，只有万条筒' },
  { id: 'xl', name: '血流成河', desc: '胡牌后继续摸打' },
  { id: 'gb', name: '国标麻将', desc: '8番起胡，81种番型' }
];

function renderRuleList() {
  var html = '';
  for (var i = 0; i < rules.length; i++) {
    var sel = rules[i].id === appState.ruleType;
    html += '<div class="rule-card ' + (sel ? 'selected' : '') + '" onclick="selectRule(\'' + rules[i].id + '\')">';
    html += '<span class="rule-name">' + rules[i].name + '</span>';
    html += '<span class="rule-desc">' + rules[i].desc + '</span>';
    html += '<span class="rule-check">' + (sel ? '✓' : '') + '</span>';
    html += '</div>';
  }
  document.getElementById('rule-list').innerHTML = html;
}

function selectRule(id) {
  appState.ruleType = id;
  renderRuleList();
  updateDebug();
}

function selectDingque() {
  if (appState.ruleType === 'gb') {
    startGame('');
  } else {
    showPage('dingque');
  }
}

function selectSuit(suit) {
  startGame(suit);
}

function startGame(dingque) {
  appState.handTiles = [];
  appState.pengTiles = [];
  appState.gangTiles = [];
  appState.dingque = dingque || '';
  var ruleNames = { xz: '血战到底', xl: '血流成河', gb: '国标麻将' };
  var dingqueNames = { wan: '(缺万)', tiao: '(缺条)', tong: '(缺筒)' };
  document.getElementById('camera-rule-tag').textContent = ruleNames[appState.ruleType] + (dingqueNames[dingque] || '');
  showPage('camera');
  updateDebug();
}

function manualRecognize() {
  var handInput = document.getElementById('manual-tiles-input').value.trim();
  var pengInput = document.getElementById('manual-peng-input').value.trim();
  var gangInput = document.getElementById('manual-gang-input').value.trim();

  if (!handInput) return;

  var handTiles = parseTileNames(handInput);
  handTiles.sort(function(a, b) { return a - b; });
  appState.handTiles = handTiles;

  appState.pengTiles = parsePengGangInput(pengInput, 3);
  appState.gangTiles = parsePengGangInput(gangInput, 4);

  showConfirmPage();
  updateDebug();
}

function parseTileNames(input) {
  var names = input.split(/[\s,，、]+/);
  var tiles = [];
  for (var i = 0; i < names.length; i++) {
    var idx = MahjongConstants.nameToIndex(names[i]);
    if (idx >= 0) tiles.push(idx);
  }
  return tiles;
}

function parsePengGangInput(input, repeatCount) {
  if (!input) return [];
  var names = input.split(/[\s,，、]+/);
  var result = [];
  for (var i = 0; i < names.length; i++) {
    var idx = MahjongConstants.nameToIndex(names[i]);
    if (idx >= 0) {
      var group = [];
      for (var j = 0; j < repeatCount; j++) group.push(idx);
      result.push(group);
    }
  }
  return result;
}

function simulateCapture() {
  var demoHands = {
    xz: [0, 0, 2, 3, 4, 9, 11, 13, 14, 18, 20, 23, 26],
    xl: [1, 2, 3, 4, 5, 10, 11, 12, 15, 16, 19, 20, 21],
    gb: [0, 1, 2, 3, 4, 9, 10, 11, 18, 19, 20, 27, 28]
  };
  appState.handTiles = demoHands[appState.ruleType] || demoHands.xz;
  appState.pengTiles = [[7, 7, 7]];
  appState.gangTiles = [];
  showConfirmPage();
  updateDebug();
}

function showConfirmPage() {
  var handTiles = appState.handTiles;
  var groups = buildHandGroups(handTiles);
  var html = '';
  for (var i = 0; i < groups.length; i++) {
    html += '<div class="tile-item"><span class="tile-name">' + groups[i].name + '</span><span class="tile-count">×' + groups[i].count + '</span></div>';
  }
  document.getElementById('hand-tile-list').innerHTML = html;
  document.getElementById('hand-count-label').textContent = '手牌 (' + handTiles.length + '张)';

  renderPengList();
  renderGangList();

  appState.showAddPeng = false;
  appState.showAddGang = false;
  document.getElementById('add-peng-area').style.display = 'none';
  document.getElementById('add-gang-area').style.display = 'none';

  showPage('confirm');
}

function renderPengList() {
  var pengHtml = '';
  for (var i = 0; i < appState.pengTiles.length; i++) {
    var g = appState.pengTiles[i];
    pengHtml += '<div class="tile-item peng-item"><span class="tile-name">' + MahjongConstants.getTileShortName(g[0]) + '×3(碰)</span><span class="tile-remove" onclick="removePeng(' + i + ')">✕</span></div>';
  }
  document.getElementById('peng-tile-list').innerHTML = pengHtml;
  document.getElementById('peng-count-label').textContent = '碰牌 (' + appState.pengTiles.length + '组)';
  document.getElementById('peng-empty').style.display = appState.pengTiles.length > 0 ? 'none' : 'inline';
}

function renderGangList() {
  var gangHtml = '';
  for (var i = 0; i < appState.gangTiles.length; i++) {
    var g = appState.gangTiles[i];
    gangHtml += '<div class="tile-item gang-item"><span class="tile-name">' + MahjongConstants.getTileShortName(g[0]) + '×4(杠)</span><span class="tile-remove" onclick="removeGang(' + i + ')">✕</span></div>';
  }
  document.getElementById('gang-tile-list').innerHTML = gangHtml;
  document.getElementById('gang-count-label').textContent = '杠牌 (' + appState.gangTiles.length + '组)';
  document.getElementById('gang-empty').style.display = appState.gangTiles.length > 0 ? 'none' : 'inline';
}

function removePeng(idx) {
  appState.pengTiles.splice(idx, 1);
  renderPengList();
  updateDebug();
}

function removeGang(idx) {
  appState.gangTiles.splice(idx, 1);
  renderGangList();
  updateDebug();
}

function toggleAddPeng() {
  appState.showAddPeng = !appState.showAddPeng;
  appState.addPengIndex = 0;
  document.getElementById('add-peng-area').style.display = appState.showAddPeng ? 'block' : 'none';
  if (appState.showAddPeng) {
    updateAddPengDisplay();
    appState.showAddGang = false;
    document.getElementById('add-gang-area').style.display = 'none';
  }
}

function toggleAddGang() {
  appState.showAddGang = !appState.showAddGang;
  appState.addGangIndex = 0;
  document.getElementById('add-gang-area').style.display = appState.showAddGang ? 'block' : 'none';
  if (appState.showAddGang) {
    updateAddGangDisplay();
    appState.showAddPeng = false;
    document.getElementById('add-peng-area').style.display = 'none';
  }
}

function updateAddPengDisplay() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.addPengIndex;
  if (tileIdx > range.max) tileIdx = range.min;
  document.getElementById('add-peng-name').textContent = MahjongConstants.getTileShortName(tileIdx);
}

function updateAddGangDisplay() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.addGangIndex;
  if (tileIdx > range.max) tileIdx = range.min;
  document.getElementById('add-gang-name').textContent = MahjongConstants.getTileShortName(tileIdx);
}

function prevPengTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.addPengIndex = (appState.addPengIndex - 1 + total) % total;
  updateAddPengDisplay();
}

function nextPengTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.addPengIndex = (appState.addPengIndex + 1) % total;
  updateAddPengDisplay();
}

function prevGangTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.addGangIndex = (appState.addGangIndex - 1 + total) % total;
  updateAddGangDisplay();
}

function nextGangTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.addGangIndex = (appState.addGangIndex + 1) % total;
  updateAddGangDisplay();
}

function confirmAddPeng() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.addPengIndex;
  appState.pengTiles.push([tileIdx, tileIdx, tileIdx]);
  renderPengList();
  toggleAddPeng();
  updateDebug();
}

function confirmAddGang() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.addGangIndex;
  appState.gangTiles.push([tileIdx, tileIdx, tileIdx, tileIdx]);
  renderGangList();
  toggleAddGang();
  updateDebug();
}

function buildHandGroups(tiles) {
  var count = MahjongConstants.tilesToCount(tiles);
  var groups = [];
  for (var i = 0; i < count.length; i++) {
    if (count[i] > 0) {
      groups.push({ tileIndex: i, name: MahjongConstants.getTileShortName(i), count: count[i] });
    }
  }
  return groups;
}

var adjustTiles = [];
function enterAdjustHand() {
  adjustTiles = appState.handTiles.slice();
  appState.adjustIndex = 0;
  updateAdjustDisplay();
  showPage('adjust');
}

function updateAdjustDisplay() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var idx = appState.adjustIndex;
  var tileIdx = range.min + idx;
  if (tileIdx > range.max) tileIdx = range.min;
  var count = MahjongConstants.tilesToCount(adjustTiles);
  document.getElementById('adjust-name').textContent = MahjongConstants.getTileShortName(tileIdx);
  document.getElementById('adjust-count').textContent = '×' + (count[tileIdx] || 0);
}

function prevTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.adjustIndex = (appState.adjustIndex - 1 + total) % total;
  updateAdjustDisplay();
}

function nextTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var total = range.max - range.min + 1;
  appState.adjustIndex = (appState.adjustIndex + 1) % total;
  updateAdjustDisplay();
}

function addTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.adjustIndex;
  adjustTiles.push(tileIdx);
  adjustTiles.sort(function(a, b) { return a - b; });
  updateAdjustDisplay();
  updateDebug();
}

function removeTile() {
  var range = MahjongConstants.getRuleTileRange(appState.ruleType);
  var tileIdx = range.min + appState.adjustIndex;
  for (var i = adjustTiles.length - 1; i >= 0; i--) {
    if (adjustTiles[i] === tileIdx) {
      adjustTiles.splice(i, 1);
      break;
    }
  }
  updateAdjustDisplay();
  updateDebug();
}

function finishAdjust() {
  appState.handTiles = adjustTiles.slice();
  showConfirmPage();
  updateDebug();
}

function confirmAndAnalyze() {
  showResultPage();
  updateDebug();
}

function showResultPage() {
  var analysis = MahjongAnalyzer.getAnalysis(
    appState.handTiles,
    appState.pengTiles,
    appState.gangTiles,
    appState.ruleType,
    appState.dingque
  );
  var html = '';

  if (analysis.dingqueName) {
    html += '<div class="dingque-badge"><span class="dingque-text">定缺: ' + analysis.dingqueName + '</span></div>';
  }

  if (analysis.mode === 'error') {
    html += '<text class="title">⚠️ 牌数异常</text>';
    html += '<text class="error-text">当前手牌 ' + analysis.handCount + ' 张，' + (analysis.errorDetail || '数量异常') + '</text>';
  } else if (analysis.mode === 'win') {
    html += '<text class="title">🎉 胡牌！</text>';
    if (analysis.fanResult) {
      html += '<div class="fan-card">';
      html += '<span class="fan-total">' + analysis.fanResult.totalFan + '番 · ' + analysis.fanResult.fanName + '</span>';
      html += '<div class="fan-list">';
      for (var fi = 0; fi < analysis.fanResult.fans.length; fi++) {
        html += '<span class="fan-item">' + analysis.fanResult.fans[fi].name + '(' + analysis.fanResult.fans[fi].fan + '番)</span>';
      }
      html += '</div></div>';
    }
  } else if (analysis.mode === 'listen') {
    html += '<text class="title">🀄 听牌</text>';
    if (analysis.listenTiles.length > 0) {
      html += '<div class="tile-list">';
      for (var i = 0; i < analysis.listenTiles.length; i++) {
        var lt = analysis.listenTiles[i];
        html += '<div class="listen-item"><span class="tile-name">' + lt.name + '</span><span class="tile-remaining">(' + lt.remaining + '张)</span>';
        if (lt.fanResult) html += '<span class="tile-fan">' + lt.fanResult.totalFan + '番</span>';
        html += '</div>';
      }
      html += '</div>';
    } else {
      html += '<text class="empty-text">未听牌</text>';
    }
  } else if (analysis.mode === 'shanten') {
    html += '<text class="title">🀄 ' + analysis.shantenLabel + '</text>';
    if (analysis.suggestions && analysis.suggestions.length > 0) {
      for (var i = 0; i < analysis.suggestions.length; i++) {
        var s = analysis.suggestions[i];
        html += '<div class="suggestion-item">';
        if (s.isDingque) html += '<span class="dingque-mark">定缺</span>';
        html += '<span class="suggestion-discard">打' + s.discardName + '</span>';
        html += '<span class="suggestion-shanten">' + (s.shantenAfter === 0 ? '→听牌' : '→' + s.shantenAfter + '进听') + '</span>';
        if (s.totalRemaining > 0) html += '<span class="suggestion-remaining">进张' + s.totalRemaining + '</span>';
        html += '</div>';
      }
    }
  } else if (analysis.mode === 'suggest') {
    html += '<text class="title">🀄 出牌建议</text>';
    if (analysis.bestSuggestion) {
      var best = analysis.bestSuggestion;
      html += '<div class="best-card">';
      if (best.isDingque) html += '<div class="dingque-tag">定缺必打</div>';
      html += '<span class="best-label">建议打</span>';
      html += '<span class="best-tile">' + best.discardName + '</span>';
      if (best.shantenAfter === 0) {
        html += '<span class="best-listen">听: ' + best.listenNames + '</span>';
      } else {
        html += '<span class="best-shanten">' + best.shantenAfter + '进听</span>';
      }
      if (best.totalRemaining > 0) html += '<span class="best-remaining">有效进张: ' + best.totalRemaining + '</span>';
      html += '</div>';
    }
    if (analysis.alternatives && analysis.alternatives.length > 0) {
      html += '<text class="alt-title">其他选择</text>';
      for (var i = 0; i < analysis.alternatives.length; i++) {
        var alt = analysis.alternatives[i];
        html += '<div class="alt-item">';
        if (alt.isDingque) html += '<span class="dingque-mark">*</span>';
        html += '<span class="alt-text">打' + alt.discardName + '</span>';
        if (alt.shantenAfter === 0) {
          html += '<span class="alt-listen">→听' + alt.listenNames + '</span>';
        } else {
          html += '<span class="alt-shanten">→' + alt.shantenAfter + '进听</span>';
        }
        if (alt.totalRemaining > 0) html += '<span class="alt-remaining">进张' + alt.totalRemaining + '</span>';
        html += '</div>';
      }
    }
    if (!analysis.bestSuggestion) {
      html += '<text class="empty-text">无法优化</text>';
    }
  }

  document.getElementById('result-content').innerHTML = html;
  showPage('result');
}

function showPage(name) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
  var target = document.getElementById('page-' + name);
  if (target) target.classList.add('active');
  var navBtns = document.querySelectorAll('.nav-btn');
  var pageNames = ['index', 'camera', 'confirm', 'result'];
  for (var i = 0; i < navBtns.length; i++) {
    navBtns[i].classList.toggle('active', pageNames[i] === name);
  }
}

function updateDebug() {
  var shanten = '-';
  if (appState.handTiles.length > 0) {
    var meldCount = (appState.pengTiles ? appState.pengTiles.length : 0) + (appState.gangTiles ? appState.gangTiles.length : 0);
    shanten = MahjongAnalyzer.calculateShanten(appState.handTiles, meldCount);
  }
  var state = {
    ruleType: appState.ruleType,
    dingque: appState.dingque || '-',
    handTiles: appState.handTiles.map(function(t) { return MahjongConstants.getTileShortName(t); }).join(' '),
    handCount: appState.handTiles.length,
    pengGroups: appState.pengTiles.map(function(g) { return MahjongConstants.getTileShortName(g[0]) + '×3'; }).join(' '),
    gangGroups: appState.gangTiles.map(function(g) { return MahjongConstants.getTileShortName(g[0]) + '×4'; }).join(' '),
    shanten: shanten
  };
  var html = '';
  for (var key in state) {
    html += '<div class="state-item">' + key + ': ' + JSON.stringify(state[key]) + '</div>';
  }
  document.getElementById('debug-state').innerHTML = html;
}

function updateHandHint() {
  var pengInput = document.getElementById('manual-peng-input').value.trim();
  var gangInput = document.getElementById('manual-gang-input').value.trim();
  var pengCount = parsePengGangInput(pengInput, 3).length;
  var gangCount = parsePengGangInput(gangInput, 4).length;
  var meldCount = pengCount + gangCount;
  var hint = document.getElementById('hand-expected-hint');
  if (meldCount > 0) {
    var listenCount = 13 - meldCount * 2;
    var drawnCount = 14 - meldCount * 2;
    hint.textContent = '（有碰/杠时期望' + listenCount + '或' + drawnCount + '张）';
  } else {
    hint.textContent = '';
  }
}

renderRuleList();
updateDebug();
</script>
</body>
</html>
